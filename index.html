<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srishti 2.6 | Blind Coding</title>
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/editor/editor.main.min.css">
    <style>
        :root {
            --bg: #0d0d10;
            --panel: #1a1b26;
            --accent: #bb9af7;
            --danger: #f7768e;
            --success: #73daca;
            --text: #a9b1d6;
        }

        body {
            margin: 0; padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: #16161e;
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .timer {
            font-size: 1.8rem;
            color: var(--accent);
            text-shadow: 0 0 15px rgba(187, 154, 247, 0.4);
        }

        .timer.warning { color: var(--danger); animation: shake 0.5s infinite; }

        main { display: flex; flex: 1; gap: 15px; padding: 15px; }

        #reference-panel {
            width: 40%;
            background: var(--panel);
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid #292e42;
            position: relative;
        }

        #editor-container {
            flex: 1;
            position: relative;
            background: var(--panel);
            border-radius: 8px;
            border: 1px solid #292e42;
        }

        #blind-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0d0d10;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; /* Allows typing through the overlay */
            transition: opacity 0.5s ease;
        }

        .blind-active-msg {
            color: #292e42;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 10px;
            user-select: none;
        }

        #terminal {
            height: 180px;
            background: #000;
            padding: 15px;
            font-size: 0.9rem;
            overflow-y: auto;
            border-top: 1px solid #292e42;
        }

        .btn {
            padding: 8px 18px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }

        .btn-run { background: var(--success); color: #000; }
        .btn-finish { background: var(--danger); color: #fff; }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(2px); }
            50% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold; color: var(--accent);">SRISHTI 2.6 // BLIND_CODE</div>
    <div class="timer" id="timer-display">READY</div>
    <div id="controls">
        <button id="run-btn" class="btn btn-run" style="display:none" onclick="executeCode()">RUN PROGRAM</button>
        <button id="finish-btn" class="btn btn-finish" onclick="endRound()">FINISH EARLY</button>
    </div>
</header>

<main>
    <div id="reference-panel">
        <h4 style="margin: 0 0 10px 0; color: var(--accent)">SOURCE PROGRAM</h4>
        <pre id="source-code" style="white-space: pre-wrap; margin:0; line-height: 1.5;">Loading Gist...</pre>
    </div>

    <div id="editor-container">
        <div id="blind-overlay">
            <div class="blind-active-msg" id="overlay-text">WAITING FOR INPUT</div>
        </div>
        <div id="monaco-editor" style="height: 100%;"></div>
    </div>
</main>

<div id="terminal" id="terminal-body">
    <div style="color: #565f89;">> System Ready. Use URL params ?lang=c/python, ?time=secs, ?gist=url</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>

<script>
    const params = new URLSearchParams(window.location.search);
    const lang = params.get('lang') || 'python';
    const gistUrl = params.get('gist');
    const timeLimit = parseInt(params.get('time')) || 300;
    const isTestMode = params.get('test') === 'true';

    let editor, pyodideInstance, timerStarted = false, timeLeft = timeLimit;

    // --- MONACO SETUP ---
    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs' }});
    require(['vs/editor/editor.main'], function() {
        editor = monaco.editor.create(document.getElementById('monaco-editor'), {
            value: "",
            language: lang === 'python' ? 'python' : 'cpp',
            theme: 'vs-dark',
            fontSize: 18,
            automaticLayout: true,
            minimap: { enabled: false },
            cursorBlinking: "none", // Hide cursor in blind mode
            renderLineHighlight: "none"
        });

        // Focus editor automatically
        editor.focus();

        // Start timer on actual content change
        const changeListener = editor.onDidChangeModelContent(() => {
            if (!timerStarted && !isTestMode) startTimer();
        });

        if (isTestMode) {
            document.getElementById('blind-overlay').style.display = 'none';
            document.getElementById('run-btn').style.display = 'inline-block';
            document.getElementById('timer-display').innerText = "TESTING";
            editor.updateOptions({ cursorBlinking: "blink" });
        }
        
        if (lang === 'python') initPython();
    });

    // --- GIST FETCHING ---
    if (gistUrl) {
        fetch(gistUrl)
            .then(res => res.text())
            .then(data => { document.getElementById('source-code').innerText = data; })
            .catch(() => { document.getElementById('source-code').innerText = "Gist Load Failed."; });
    }

    // --- COMPETITION LOGIC ---
    function startTimer() {
        timerStarted = true;
        document.getElementById('overlay-text').innerText = "BLIND ACTIVE";
        
        const interval = setInterval(() => {
            timeLeft--;
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            document.getElementById('timer-display').innerText = `${m}:${s.toString().padStart(2, '0')}`;
            
            if (timeLeft <= 10) document.getElementById('timer-display').classList.add('warning');
            if (timeLeft <= 0) { clearInterval(interval); endRound(); }
        }, 1000);
    }

    function endRound() {
        document.getElementById('blind-overlay').style.opacity = '0';
        setTimeout(() => document.getElementById('blind-overlay').style.display = 'none', 500);
        document.getElementById('run-btn').style.display = 'inline-block';
        document.getElementById('finish-btn').style.display = 'none';
        editor.updateOptions({ readOnly: true, cursorBlinking: "blink" });
        log("TIME EXPIRED. Evaluation mode active.", "var(--accent)");
    }

    function log(msg, color = "#adbac7") {
        const div = document.createElement('div');
        div.style.color = color;
        div.innerText = `> ${msg}`;
        document.getElementById('terminal').appendChild(div);
    }

    // --- ENGINES ---
    async function initPython() {
        log("Loading Python Runtime...", "#565f89");
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js';
        script.onload = async () => {
            pyodideInstance = await loadPyodide();
            log("Python Engine Ready.", "var(--success)");
        };
        document.head.appendChild(script);
    }

    async function executeCode() {
        const code = editor.getValue();
        log("Executing...");
        if (lang === 'python') {
            try {
                await pyodideInstance.runPythonAsync(`import sys, io\nsys.stdout = io.StringIO()`);
                await pyodideInstance.runPythonAsync(code);
                log(pyodideInstance.runPython("sys.stdout.getvalue()") || "No Output.");
            } catch (err) { log(err, "var(--danger)"); }
        } else {
            const res = await fetch("https://emkc.org/api/v2/piston/execute", {
                method: "POST",
                body: JSON.stringify({ language: "c", version: "10.2.0", files: [{ content: code }] })
            });
            const out = await res.json();
            log(out.run.output || "No output.");
        }
    }
</script>
</body>
</html>
